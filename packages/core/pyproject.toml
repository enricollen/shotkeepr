[project]
name = "shotkeepr-core"
version = "0.1.0"
description = "Nucleo di ShotKeepr: dominio, casi d'uso, adattatori e API locale"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "alembic>=1.13",
    "anyio>=4.4",
    "fastapi>=0.115",
    "filelock>=3.16",
    "httpx>=0.27",
    "keyring>=25",
    "numpy>=1.26",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "rawpy>=0.24",
    "shotkeepr-plugin-sdk",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.30,<1.31"]
cuda = ["onnxruntime-gpu>=1.30,<1.31"]

[project.scripts]
shotkeepr-core = "shotkeepr.core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotkeepr"]
