[project]
name = "shotkeepr-core"
version = "0.1.0"
description = "Nucleo di ShotKeepr: dominio, casi d'uso, adattatori e API locale"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "alembic>=1.13",
    "anyio>=4.4",
    "fastapi>=0.115",
    "keyring>=25",
    "shotkeepr-plugin-sdk",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
shotkeepr-core = "shotkeepr.core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotkeepr"]
