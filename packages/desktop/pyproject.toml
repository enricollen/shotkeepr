[project]
name = "shotkeepr-desktop"
version = "0.1.0"
description = "Applicazione desktop di ShotKeepr (client dell'API del nucleo)"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = []

[project.gui-scripts]
shotkeepr = "shotkeepr.desktop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shotkeepr"]
